name: 改进建议 / Feature request
description: 说明具体使用场景与期望
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望如何工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代办法和补充信息
